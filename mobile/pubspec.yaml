name: flutter_keycloak_app
description: Mobile Flutter application integrated with Keycloak OIDC (PKCE) and Golang Backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_appauth: ^8.0.3
  flutter_secure_storage: ^9.2.2
  dio: ^5.7.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

dependency_overrides:
  path_provider_foundation: 2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

